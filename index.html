<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON CITY — Open World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.topbar{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.panel{
    background:rgba(5,10,20,.82);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:11px 15px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.label{
    color:#94a3b8;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.6px;
}

.value{
    font-size:20px;
    font-weight:800;
    margin-top:3px;
}

#missionPanel{
    position:absolute;
    top:95px;
    left:18px;
    width:300px;
}

#missionTitle{
    font-size:15px;
    font-weight:bold;
    margin-top:5px;
}

#missionDescription{
    color:#aebbd0;
    font-size:12px;
    margin-top:5px;
    line-height:1.5;
}

#wantedPanel{
    position:absolute;
    top:95px;
    right:18px;
}

#wanted{
    font-size:23px;
    letter-spacing:4px;
    color:#64748b;
}

.star{
    color:#facc15;
    text-shadow:0 0 12px #facc15;
}

#speedometer{
    position:absolute;
    right:25px;
    bottom:25px;

    width:180px;
    height:180px;

    border-radius:50%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(4,8,15,.88);

    border:5px solid rgba(255,255,255,.13);

    box-shadow:
        0 0 50px rgba(0,0,0,.4);
}

#speed{
    font-size:46px;
    font-weight:900;
}

#kmh{
    color:#64748b;
    font-size:12px;
}

#fuelPanel{
    position:absolute;
    left:20px;
    bottom:25px;
    width:220px;
}

.bar{
    height:8px;
    background:#1e293b;
    border-radius:10px;
    overflow:hidden;
    margin-top:7px;
}

#fuel{
    width:100%;
    height:100%;
    background:#22c55e;
    transition:.2s;
}

#damage{
    width:100%;
    height:100%;
    background:#ef4444;
}

#minimap{
    position:absolute;
    right:220px;
    bottom:25px;

    width:170px;
    height:170px;

    border-radius:50%;
    overflow:hidden;

    background:#0f172a;

    border:3px solid rgba(255,255,255,.2);
}

#map{
    width:100%;
    height:100%;
}

/* ================= MENU ================= */

.screen{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #162238 0%,
            #05070b 65%
        );
}

.menu{
    width:min(800px,90%);
}

.logo{
    font-size:clamp(48px,10vw,105px);
    font-weight:1000;
    letter-spacing:8px;

    background:
        linear-gradient(
            90deg,
            #22d3ee,
            #6366f1,
            #a855f7
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    text-shadow:
        0 0 60px rgba(34,211,238,.2);
}

.tagline{
    color:#94a3b8;
    font-size:18px;
    margin:15px 0 35px;
}

.startButton{
    padding:17px 45px;
    border:0;
    border-radius:10px;

    color:white;
    background:#2563eb;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.startButton:hover{
    background:#3b82f6;
    transform:translateY(-2px);
}

.controls{
    margin-top:40px;

    display:grid;
    grid-template-columns:
        repeat(4,1fr);

    gap:10px;
}

.control{
    padding:13px;

    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);

    border-radius:8px;

    color:#94a3b8;
    font-size:12px;
}

/* ================= GAME OVER ================= */

#gameOver{
    display:none;
}

.bigText{
    font-size:60px;
    font-weight:900;
}

.stats{
    margin:25px auto;
    max-width:400px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    padding:15px;
    border-radius:9px;
    background:rgba(255,255,255,.05);
}

/* ================= MOBILE ================= */

#mobile{
    display:none;

    position:fixed;
    left:15px;
    right:15px;
    bottom:15px;

    z-index:20;

    justify-content:space-between;

    pointer-events:none;
}

.mobileGroup{
    display:flex;
    gap:10px;
}

.mobileButton{
    width:60px;
    height:60px;

    border-radius:50%;

    border:1px solid #475569;

    background:rgba(15,23,42,.82);

    color:white;

    font-size:22px;

    pointer-events:auto;

    touch-action:none;
}

.fire{
    background:rgba(239,68,68,.5);
}

@media(max-width:700px){

    .topbar{
        top:8px;
        left:8px;
        right:8px;
    }

    .panel{
        padding:8px 10px;
    }

    #missionPanel{
        top:80px;
        left:8px;
        width:240px;
    }

    #wantedPanel{
        top:80px;
        right:8px;
    }

    #minimap{
        width:120px;
        height:120px;
        right:10px;
        bottom:100px;
    }

    #speedometer{
        width:125px;
        height:125px;
        right:10px;
        bottom:100px;
    }

    #speed{
        font-size:30px;
    }

    #fuelPanel{
        left:10px;
        bottom:15px;
        width:180px;
    }

    #mobile{
        display:flex;
    }

    .controls{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game"></div>


<!-- ================= HUD ================= -->

<div id="hud">

    <div class="topbar">

        <div class="panel">
            <div class="label">Cash</div>
            <div class="value">
                $<span id="money">2500</span>
            </div>
        </div>

        <div class="panel">
            <div class="label">Reputation</div>
            <div class="value">
                <span id="rep">0</span>
            </div>
        </div>

        <div class="panel">
            <div class="label">Time</div>
            <div class="value" id="clock">
                12:00
            </div>
        </div>

    </div>


    <div id="missionPanel" class="panel">

        <div class="label">
            Current Mission
        </div>

        <div id="missionTitle">
            CITY RUN
        </div>

        <div id="missionDescription">
            Drive to the blue checkpoint.
        </div>

    </div>


    <div id="wantedPanel" class="panel">

        <div class="label">
            Wanted
        </div>

        <div id="wanted">
            ☆☆☆☆☆
        </div>

    </div>


    <div id="fuelPanel" class="panel">

        <div class="label">
            Fuel
        </div>

        <div class="bar">
            <div id="fuel"></div>
        </div>

        <div class="label" style="margin-top:10px">
            Vehicle
        </div>

        <div class="bar">
            <div id="damage"></div>
        </div>

    </div>


    <div id="minimap">
        <canvas id="map"
                width="170"
                height="170"></canvas>
    </div>


    <div id="speedometer">

        <div id="speed">
            0
        </div>

        <div id="kmh">
            KM/H
        </div>

    </div>

</div>


<!-- ================= START ================= -->

<div id="startScreen" class="screen">

    <div class="menu">

        <div class="logo">
            NEON CITY
        </div>

        <div class="tagline">
            OPEN WORLD • DRIVE • RACE • ESCAPE
        </div>

        <button
            class="startButton"
            id="start">
            ENTER CITY
        </button>

        <div class="controls">

            <div class="control">
                W / ↑<br>
                Accelerate
            </div>

            <div class="control">
                S / ↓<br>
                Brake
            </div>

            <div class="control">
                A / D<br>
                Steering
            </div>

            <div class="control">
                SPACE<br>
                Handbrake
            </div>

        </div>

    </div>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="screen">

    <div class="menu">

        <div class="bigText">
            CITY COMPLETE
        </div>

        <div class="tagline">
            You completed the main city run.
        </div>

        <div class="stats">

            <div class="stat">
                Cash<br>
                <strong>
                    $<span id="finalMoney">0</span>
                </strong>
            </div>

            <div class="stat">
                Reputation<br>
                <strong>
                    <span id="finalRep">0</span>
                </strong>
            </div>

        </div>

        <button
            class="startButton"
            id="restart">
            PLAY AGAIN
        </button>

    </div>

</div>


<!-- ================= MOBILE ================= -->

<div id="mobile">

    <div class="mobileGroup">

        <button
            class="mobileButton"
            id="left">
            ◀
        </button>

        <button
            class="mobileButton"
            id="right">
            ▶
        </button>

    </div>

    <div class="mobileGroup">

        <button
            class="mobileButton"
            id="brake">
            ▼
        </button>

        <button
            class="mobileButton"
            id="gas">
            ▲
        </button>

        <button
            class="mobileButton fire"
            id="handbrake">
            ◆
        </button>

    </div>

</div>


<!-- Three.js -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* ==========================================================
   ENGINE
========================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8db6d5);

scene.fog =
    new THREE.Fog(
        0x8db6d5,
        160,
        700
    );


const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1500
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* ==========================================================
   LIGHTING
========================================================== */

const ambient =
    new THREE.HemisphereLight(
        0xc9e5ff,
        0x252525,
        1.5
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    180,
    250,
    100
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


/* ==========================================================
   GROUND
========================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1200,
            1200
        ),
        new THREE.MeshStandardMaterial({
            color:0x304f35,
            roughness:1
        })
    );

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* ==========================================================
   CITY
========================================================== */

const ROAD=20;
const GAP=80;
const CITY=640;


/* Road material */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x242424,
        roughness:.95
    });


function road(
    x,
    z,
    w,
    d
){

    const r =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                w,
                d
            ),
            roadMaterial
        );

    r.rotation.x=
        -Math.PI/2;

    r.position.set(
        x,
        .02,
        z
    );

    r.receiveShadow=true;

    scene.add(r);
}


/* Roads */

for(
    let p=-280;
    p<=280;
    p+=GAP
){

    road(
        p,
        0,
        ROAD,
        CITY
    );

    road(
        0,
        p,
        CITY,
        ROAD
    );
}


/* ==========================================================
   BUILDINGS
========================================================== */

const buildingColors=[
    0x334155,
    0x475569,
    0x52525b,
    0x3f3f46,
    0x374151,
    0x4b5563
];


function building(
    x,
    z,
    w,
    d,
    h
){

    const material =
        new THREE.MeshStandardMaterial({
            color:
                buildingColors[
                    Math.floor(
                        Math.random()*
                        buildingColors.length
                    )
                ],
            roughness:.85
        });


    const b =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            material
        );


    b.position.set(
        x,
        h/2,
        z
    );

    b.castShadow=true;
    b.receiveShadow=true;

    scene.add(b);


    /* Windows */

    const windowMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffdf8a
        });


    const rows =
        Math.max(
            2,
            Math.floor(h/8)
        );

    const cols =
        Math.max(
            2,
            Math.floor(w/5)
        );


    for(
        let r=0;
        r<rows;
        r++
    ){

        for(
            let c=0;
            c<cols;
            c++
        ){

            if(
                Math.random()<.28
            ) continue;


            const win =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        1.5,
                        2
                    ),
                    windowMaterial
                );


            win.position.set(
                x-w/2+3+c*5,
                4+r*8,
                z-d/2-.02
            );

            scene.add(win);
        }
    }
}


/* Building blocks */

for(
    let x=-280;
    x<280;
    x+=GAP
){

    for(
        let z=-280;
        z<280;
        z+=GAP
    ){

        const bx=
            x+GAP/2;

        const bz=
            z+GAP/2;


        if(
            Math.abs(bx)<20 ||
            Math.abs(bz)<20
        ) continue;


        building(
            bx,
            bz,
            38+Math.random()*20,
            38+Math.random()*20,
            25+Math.random()*110
        );
    }
}


/* ==========================================================
   ROAD LINES
========================================================== */

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color:0xf8fafc
    });


for(
    let p=-280;
    p<=280;
    p+=GAP
){

    for(
        let q=-300;
        q<300;
        q+=28
    ){

        const a =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,
                    .04,
                    11
                ),
                lineMaterial
            );

        a.position.set(
            p,
            .05,
            q
        );

        scene.add(a);


        const b =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    11,
                    .04,
                    .35
                ),
                lineMaterial
            );

        b.position.set(
            q,
            .05,
            p
        );

        scene.add(b);
    }
}


/* ==========================================================
   CAR CREATOR
========================================================== */

function makeCar(
    color,
    police=false
){

    const group =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4,
                .85,
                7.5
            ),
            new THREE.MeshStandardMaterial({
                color:color,
                metalness:.4,
                roughness:.28
            })
        );


    body.position.y=.8;

    body.castShadow=true;

    group.add(body);


    const cabin =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.9,
                .85,
                3.2
            ),
            new THREE.MeshStandardMaterial({
                color:0x111827,
                metalness:.1,
                roughness:.2
            })
        );


    cabin.position.set(
        0,
        1.45,
        .3
    );

    cabin.castShadow=true;

    group.add(cabin);


    /* Wheels */

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color:0x070707,
            roughness:.9
        });


    const wheelGeometry =
        new THREE.CylinderGeometry(
            .57,
            .57,
            .48,
            20
        );


    [
        [-2,.55,-2.4],
        [2,.55,-2.4],
        [-2,.55,2.4],
        [2,.55,2.4]
    ].forEach(
        p=>{

            const w =
                new THREE.Mesh(
                    wheelGeometry,
                    wheelMaterial
                );

            w.rotation.z=
                Math.PI/2;

            w.position.set(
                p[0],
                p[1],
                p[2]
            );

            w.castShadow=true;

            group.add(w);
        }
    );


    /* Lights */

    const white =
        new THREE.MeshBasicMaterial({
            color:0xffffdd
        });


    const red =
        new THREE.MeshBasicMaterial({
            color:0xff2020
        });


    [-1.2,1.2].forEach(
        x=>{

            const head =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .7,
                        .25,
                        .1
                    ),
                    white
                );

            head.position.set(
                x,
                .9,
                -3.8
            );

            group.add(head);


            const tail =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .7,
                        .25,
                        .1
                    ),
                    red
                );

            tail.position.set(
                x,
                .9,
                3.8
            );

            group.add(tail);
        }
    );


    /* Police light */

    if(police){

        const blue =
            new THREE.MeshBasicMaterial({
                color:0x2563eb
            });

        const red2 =
            new THREE.MeshBasicMaterial({
                color:0xef4444
            });


        const l =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1,
                    .25,
                    .7
                ),
                blue
            );

        l.position.y=2;

        group.add(l);


        const r =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .7,
                    .25,
                    .7
                ),
                red2
            );

        r.position.set(
            .7,
            2,
            0
        );

        group.add(r);
    }


    return group;
}


/* ==========================================================
   PLAYER
========================================================== */

const player =
    makeCar(0x2563eb);

player.position.set(
    0,
    0,
    120
);

scene.add(player);


/* ==========================================================
   TRAFFIC
========================================================== */

const traffic=[];

const colors=[
    0xef4444,
    0xf59e0b,
    0x22c55e,
    0xa855f7,
    0xf8fafc,
    0x14b8a6,
    0xec4899
];


function spawnTraffic(){

    const horizontal=
        Math.random()>.5;


    const car =
        makeCar(
            colors[
                Math.floor(
                    Math.random()*
                    colors.length
                )
            ]
        );


    if(horizontal){

        car.position.set(
            -300+
            Math.random()*600,
            0,
            Math.round(
                (-280+
                Math.random()*560)/GAP
            )*GAP
        );

    }else{

        car.position.set(
            Math.round(
                (-280+
                Math.random()*560)/GAP
            )*GAP,

            0,

            -300+
            Math.random()*600
        );
    }


    car.userData.horizontal=
        horizontal;

    car.userData.speed=
        8+
        Math.random()*12;

    car.userData.direction=
        Math.random()>.5
        ?1:-1;


    if(!horizontal)
        car.rotation.y=
            Math.PI/2;


    scene.add(car);

    traffic.push(car);
}


for(
    let i=0;
    i<25;
    i++
){

    spawnTraffic();
}


/* ==========================================================
   POLICE
========================================================== */

const policeCars=[];


function spawnPolice(){

    if(
        policeCars.length>=
        wantedLevel*2
    ) return;


    const cop =
        makeCar(
            0x111827,
            true
        );


    cop.position.set(
        player.position.x+
        (Math.random()-.5)*100,

        0,

        player.position.z+
        (Math.random()-.5)*100
    );


    cop.userData.speed=
        18+
        wantedLevel*6;


    scene.add(cop);

    policeCars.push(cop);
}


/* ==========================================================
   CHECKPOINT
========================================================== */

let checkpoint;


function createCheckpoint(){

    if(checkpoint)
        scene.remove(checkpoint);


    checkpoint =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                10,
                .7,
                16,
                48
            ),
            new THREE.MeshBasicMaterial({
                color:0x22d3ee
            })
        );


    checkpoint.rotation.x=
        Math.PI/2;

    checkpoint.position.set(
        (
            Math.floor(
                Math.random()*7
            )-3
        )*GAP,

        7,

        (
            Math.floor(
                Math.random()*7
            )-3
        )*GAP
    );


    scene.add(checkpoint);
}

createCheckpoint();


/* ==========================================================
   GAME VARIABLES
========================================================== */

let running=false;

let keys={};

let speed=0;

let money=2500;

let reputation=0;

let fuel=100;

let damage=0;

let wantedLevel=0;

let cityTime=12;

let missionNumber=1;

let distance=0;

let lastTime=performance.now();


/* ==========================================================
   INPUT
========================================================== */

addEventListener(
    "keydown",
    e=>{
        keys[
            e.key.toLowerCase()
        ]=true;
    }
);


addEventListener(
    "keyup",
    e=>{
        keys[
            e.key.toLowerCase()
        ]=false;
    }
);


/* ==========================================================
   MOBILE
========================================================== */

function mobileControl(
    id,
    key
){

    const b=
        document.getElementById(id);


    b.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    b.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );


    b.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );
}


mobileControl("left","a");
mobileControl("right","d");
mobileControl("gas","w");
mobileControl("brake","s");
mobileControl("handbrake"," ");


/* ==========================================================
   START
========================================================== */

function startGame(){

    running=true;

    money=2500;
    reputation=0;
    fuel=100;
    damage=0;
    wantedLevel=0;
    speed=0;
    distance=0;
    missionNumber=1;
    cityTime=12;


    player.position.set(
        0,
        0,
        120
    );

    player.rotation.y=0;


    document
        .getElementById(
            "startScreen"
        )
        .style.display="none";


    document
        .getElementById(
            "gameOver"
        )
        .style.display="none";


    setMission();


    lastTime=
        performance.now();


    requestAnimationFrame(
        gameLoop
    );
}


/* ==========================================================
   MISSION
========================================================== */

function setMission(){

    const missions=[
        [
            "CITY RUN",
            "Reach the blue checkpoint."
        ],
        [
            "EXPRESS DELIVERY",
            "Reach the next checkpoint before time runs out."
        ],
        [
            "NIGHT DRIVE",
            "Complete another city checkpoint."
        ],
        [
            "FINAL RUN",
            "Finish the final checkpoint."
        ]
    ];


    const m=
        missions[
            Math.min(
                missionNumber-1,
                missions.length-1
            )
        ];


    document
        .getElementById(
            "missionTitle"
        )
        .textContent=m[0];


    document
        .getElementById(
            "missionDescription"
        )
        .textContent=m[1];
}


/* ==========================================================
   UPDATE PLAYER
========================================================== */

function updatePlayer(dt){

    const gas=
        keys["w"] ||
        keys["arrowup"];

    const brake=
        keys["s"] ||
        keys["arrowdown"];

    const left=
        keys["a"] ||
        keys["arrowleft"];

    const right=
        keys["d"] ||
        keys["arrowright"];


    if(gas){

        speed+=
            32*dt;

    }else{

        speed-=
            10*dt;
    }


    if(brake){

        speed-=
            45*dt;
    }


    if(keys[" "]){

        speed-=
            30*dt;
    }


    speed=
        THREE.MathUtils.clamp(
            speed,
            -20,
            75
        );


    if(Math.abs(speed)>.5){

        const steer=
            Math.min(
                Math.abs(speed)/35,
                1
            );


        if(left)
            player.rotation.y+=
                1.8*dt*
                steer*
                (speed>0?1:-1);


        if(right)
            player.rotation.y-=
                1.8*dt*
                steer*
                (speed>0?1:-1);
    }


    player.translateZ(
        -speed*dt
    );


    distance+=
        Math.abs(speed)*dt;


    fuel-=
        Math.abs(speed)*
        dt*
        .004;


    if(fuel<0)
        fuel=0;


    /* Boundaries */

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -300,
            300
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -300,
            300
        );


    /* Checkpoint */

    if(checkpoint){

        const d=
            player.position.distanceTo(
                checkpoint.position
            );


        if(d<13){

            money+=
                500;

            reputation+=
                10;

            fuel=
                Math.min(
                    100,
                    fuel+25
                );


            missionNumber++;


            if(
                missionNumber>4
            ){

                finishGame();

                return;
            }


            createCheckpoint();

            setMission();
        }
    }


    /* Traffic collisions */

    traffic.forEach(
        car=>{

            const d=
                player.position.distanceTo(
                    car.position
                );


            if(d<4){

                speed*=-.35;

                damage+=
                    12;

                wantedLevel=
                    Math.min(
                        5,
                        wantedLevel+1
                    );
            }
        }
    );


    /* Police collisions */

    policeCars.forEach(
        cop=>{

            const d=
                player.position.distanceTo(
                    cop.position
                );


            if(d<5){

                speed*=-.3;

                damage+=8;
            }
        }
    );


    if(damage>=100){

        speed=0;

        fuel=0;
    }
}


/* ==========================================================
   TRAFFIC UPDATE
========================================================== */

function updateTraffic(dt){

    traffic.forEach(
        car=>{

            const axis=
                car.userData.horizontal
                ?"x"
                :"z";


            car.position[axis]+=
                car.userData.speed*
                car.userData.direction*
                dt;


            if(
                car.position.x>320 ||
                car.position.x<-320 ||
                car.position.z>320 ||
                car.position.z<-320
            ){

                if(
                    car.userData.horizontal
                )
                    car.position.x=-320;
                else
                    car.position.z=-320;
            }
        }
    );
}


/* ==========================================================
   POLICE UPDATE
========================================================== */

function updatePolice(dt){

    if(
        wantedLevel<=0
    ) return;


    if(
        Math.random()<dt*.35
    ){

        spawnPolice();
    }


    for(
        let i=policeCars.length-1;
        i>=0;
        i--
    ){

        const cop=
            policeCars[i];


        const direction=
            new THREE.Vector3()
                .subVectors(
                    player.position,
                    cop.position
                );


        direction.y=0;


        const dist=
            direction.length();


        if(dist>2){

            direction.normalize();


            const targetAngle=
                Math.atan2(
                    -direction.x,
                    -direction.z
                );


            cop.rotation.y=
                THREE.MathUtils.lerp(
                    cop.rotation.y,
                    targetAngle,
                    dt*2
                );


            cop.translateZ(
                -cop.userData.speed*
                dt
            );
        }


        if(dist>250){

            scene.remove(cop);

            policeCars.splice(
                i,
                1
            );
        }
    }


    /* Wanted decreases */

    if(
        Math.random()<dt*.05
    ){

        wantedLevel=
            Math.max(
                0,
                wantedLevel-1
            );
    }
}


/* ==========================================================
   DAY NIGHT
========================================================== */

function updateDayNight(dt){

    cityTime+=
        dt*.65;


    if(cityTime>=24)
        cityTime=0;


    const daylight=
        Math.max(
            0,
            Math.sin(
                (cityTime-6)/
                24*
                Math.PI*2
            )
        );


    const sky=
        new THREE.Color();


    sky.setHSL(
        .59,
        .35,
        .10+
        daylight*.45
    );


    scene.background.copy(
        sky
    );


    scene.fog.color.copy(
        sky
    );


    sun.intensity=
        .25+
        daylight*1.8;


    ambient.intensity=
        .35+
        daylight;
}


/* ==========================================================
   CAMERA
========================================================== */

function updateCamera(dt){

    const target=
        new THREE.Vector3(
            0,
            7,
            15
        );


    target.applyQuaternion(
        player.quaternion
    );


    target.add(
        player.position
    );


    camera.position.lerp(
        target,
        1-
        Math.pow(
            .001,
            dt
        )
    );


    const look=
        player.position.clone();


    look.y+=1;


    camera.lookAt(
        look
    );
}


/* ==========================================================
   HUD
========================================================== */

function updateHUD(){

    document
        .getElementById(
            "money"
        )
        .textContent=
        Math.floor(money);


    document
        .getElementById(
            "rep"
        )
        .textContent=
        reputation;


    document
        .getElementById(
            "speed"
        )
        .textContent=
        Math.floor(
            Math.abs(speed)*3.6
        );


    document
        .getElementById(
            "fuel"
        )
        .style.width=
        fuel+"%";


    document
        .getElementById(
            "damage"
        )
        .style.width=
        Math.max(
            0,
            100-damage
        )+"%";


    let stars="";


    for(
        let i=0;
        i<5;
        i++
    ){

        stars+=
            i<wantedLevel
            ?'<span class="star">★</span>'
            :"☆";
    }


    document
        .getElementById(
            "wanted"
        )
        .innerHTML=
        stars;


    const h=
        Math.floor(cityTime);


    const m=
        Math.floor(
            (cityTime-h)*60
        );


    document
        .getElementById(
            "clock"
        )
        .textContent=
        String(h).padStart(2,"0")
        +":"+
        String(m).padStart(2,"0");
}


/* ==========================================================
   MINIMAP
========================================================== */

const mapCanvas=
    document.getElementById(
        "map"
    );

const mapCtx=
    mapCanvas.getContext("2d");


function updateMap(){

    mapCtx.fillStyle=
        "#0b1220";

    mapCtx.fillRect(
        0,
        0,
        170,
        170
    );


    mapCtx.strokeStyle=
        "#334155";

    mapCtx.lineWidth=5;


    for(
        let p=-280;
        p<=280;
        p+=GAP
    ){

        const s=
            85+
            p/640*150;


        mapCtx.beginPath();

        mapCtx.moveTo(
            s,
            0
        );

        mapCtx.lineTo(
            s,
            170
        );

        mapCtx.stroke();


        mapCtx.beginPath();

        mapCtx.moveTo(
            0,
            s
        );

        mapCtx.lineTo(
            170,
            s
        );

        mapCtx.stroke();
    }


    /* Player */

    const px=
        85+
        player.position.x/
        640*150;


    const pz=
        85+
        player.position.z/
        640*150;


    mapCtx.fillStyle=
        "#38bdf8";

    mapCtx.beginPath();

    mapCtx.arc(
        px,
        pz,
        5,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    /* Mission */

    if(checkpoint){

        const cx=
            85+
            checkpoint.position.x/
            640*150;


        const cz=
            85+
            checkpoint.position.z/
            640*150;


        mapCtx.fillStyle=
            "#22d3ee";

        mapCtx.beginPath();

        mapCtx.arc(
            cx,
            cz,
            5,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }


    /* Police */

    mapCtx.fillStyle=
        "#ef4444";


    policeCars.forEach(
        cop=>{

            const x=
                85+
                cop.position.x/
                640*150;


            const z=
                85+
                cop.position.z/
                640*150;


            mapCtx.beginPath();

            mapCtx.arc(
                x,
                z,
                3,
                0,
                Math.PI*2
            );

            mapCtx.fill();
        }
    );
}


/* ==========================================================
   FINISH
========================================================== */

function finishGame(){

    running=false;


    document
        .getElementById(
            "finalMoney"
        )
        .textContent=
        Math.floor(money);


    document
        .getElementById(
            "finalRep"
        )
        .textContent=
        reputation;


    document
        .getElementById(
            "gameOver"
        )
        .style.display=
        "flex";
}


/* ==========================================================
   MAIN LOOP
========================================================== */

function gameLoop(time){

    if(!running)
        return;


    let dt=
        (time-lastTime)/
        1000;


    dt=
        Math.min(
            dt,
            .05
        );


    lastTime=time;


    updatePlayer(dt);

    updateTraffic(dt);

    updatePolice(dt);

    updateDayNight(dt);

    updateCamera(dt);

    updateHUD();

    updateMap();


    renderer.render(
        scene,
        camera
    );


    requestAnimationFrame(
        gameLoop
    );
}


/* ==========================================================
   BUTTONS
========================================================== */

document
    .getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


/* ==========================================================
   RESIZE
========================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ==========================================================
   INITIAL CAMERA
========================================================== */

camera.position.set(
    0,
    8,
    25
);

camera.lookAt(
    0,
    0,
    0
);


renderer.render(
    scene,
    camera
);

</script>
